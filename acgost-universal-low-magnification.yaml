mixed-port: 7890
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
# bind-address: '*'
mode: rule
log-level: warning
external-controller: 0.0.0.0:9090
secret: "@@Mihomo12315123"
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
etag-support: true
global-client-fingerprint: chrome
hosts:
